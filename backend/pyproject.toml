[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12.13"
dependencies = [
    "alembic>=1.18.5",
    "fastapi>=0.139.2",
    "kagglehub>=1.0.2",
    "pandas>=3.0.3",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.51.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx2>=2.7.0",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[tool.ruff]
target-version = "py312"
line-length = 88

extend-exclude = [
    ".venv",
    "migrations/versions",
]

[tool.ruff.lint]
select = [
    "E",   # erros de estilo
    "F",   # erros comuns de Python
    "I",   # organização de imports
    "B",   # possíveis bugs
    "UP",  # modernização da sintaxe
    "SIM", # simplificações
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

#Configuracoes do mypy
[tool.mypy]
python_version = "3.12"
files = ["app"]

pretty = true
show_error_codes = true

check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true

warn_return_any = true
warn_unused_configs = true
